name: Deploy Mexico City Money Calendar

on:
  push:
    branches:
      - mexico-calendar
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out calendar branch
        uses: actions/checkout@v4

      - name: Prepare isolated calendar app
        run: |
          rm -rf /tmp/mexico-calendar-deploy
          mkdir -p /tmp/mexico-calendar-deploy/netlify/functions
          cp index.html /tmp/mexico-calendar-deploy/index.html
          cp netlify.toml /tmp/mexico-calendar-deploy/netlify.toml
          cp package.json /tmp/mexico-calendar-deploy/package.json
          cp netlify/functions/state.mts /tmp/mexico-calendar-deploy/netlify/functions/state.mts

      - name: Deploy to dedicated Netlify project
        working-directory: /tmp/mexico-calendar-deploy
        run: >
          npx -y @netlify/mcp@latest
          --site-id 9da44dc0-9c29-4fc2-80e6-51a9a2c20d86
